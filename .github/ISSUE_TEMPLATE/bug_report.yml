name: 🐞 Relatar um problema
description: Algo não funciona como deveria no widget.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Obrigado por ajudar a melhorar o widget!
        **Não cole aqui o link do seu perfil, seu SteamID ou o conteúdo do `config.json`.**

  - type: textarea
    id: what-happened
    attributes:
      label: O que aconteceu?
      description: Descreva o problema e o que você esperava que acontecesse.
      placeholder: Ao clicar em atualizar, a lista fica vazia em vez de mostrar meus jogos.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Passos para reproduzir
      placeholder: |
        1. Abra o widget
        2. Clique em Configurações
        3. Troque o tema para Claro
        4. ...
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Versão do widget
      description: Está no nome da Release que você baixou (ex.: v1.0.0).
      placeholder: v1.0.0
    validations:
      required: true

  - type: dropdown
    id: windows
    attributes:
      label: Windows
      options:
        - Windows 11
        - Windows 10
    validations:
      required: true

  - type: dropdown
    id: theme
    attributes:
      label: Tema usado
      options:
        - Vidro
        - Escuro
        - Claro
        - Acontece em todos

  - type: textarea
    id: log
    attributes:
      label: Trecho do log de erros (opcional)
      description: |
        O log fica em `%LocalAppData%\SteamWishlistWidget\logs\error.log` e não contém seu SteamID.
        Cole só as linhas do horário do problema.
      render: text

  - type: textarea
    id: screenshots
    attributes:
      label: Prints (opcional)
      description: Se possível, esconda o nome dos jogos ou use o modo demonstração.
