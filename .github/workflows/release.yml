# A cada envio para a main: testa, gera o .exe único (não precisa instalar nada para rodar) e publica uma
# release no GitHub com a versão do Directory.Build.props. Para lançar de novo, suba a <Version> antes.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

# Só o necessário para criar a release.
permissions:
  contents: write

# Duas releases ao mesmo tempo poderiam disputar a mesma versão.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Ler a versão
        id: version
        run: |
          $version = (Select-Xml -Path Directory.Build.props -XPath '//Version').Node.InnerText.Trim()
          if (-not $version) { throw "Não achei a <Version> no Directory.Build.props." }

          # Não sobrescreve uma release que já existe: cada lançamento precisa de uma versão nova.
          gh release view "v$version" *> $null
          if ($LASTEXITCODE -eq 0) {
            throw "A release v$version já existe. Suba a <Version> no Directory.Build.props antes de enviar para a main."
          }

          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Output "Versão: $version"
          exit 0

      - name: Testar
        run: dotnet test SteamWishlistWidget.sln -c Release

      - name: Gerar o .exe
        run: >
          dotnet publish src/SteamWishlistWidget -c Release -r win-x64 --self-contained
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -p:DebugType=none -o publish

      - name: Publicar a release
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $file = "SteamWishlistWidget-v$version-win-x64.exe"
          Move-Item publish/SteamWishlistWidget.exe $file
          gh release create "v$version" $file --title "Steam Wishlist Widget v$version" --generate-notes --target $env:GITHUB_SHA
